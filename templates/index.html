<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Text Summarizer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #667085;
    --border: #d9dee6; --accent: #3b5bdb; --accent-text: #ffffff;
    --ok-bg: #eef6ff; --err-bg: #fdecec; --err-text: #a12626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --card: #1b2028; --text: #e8ecf2; --muted: #98a2b3;
      --border: #2e3541; --accent: #7c93f5; --accent-text: #10131a;
      --ok-bg: #1d2740; --err-bg: #3a1c1c; --err-text: #f4a3a3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 56px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 16px;
  }
  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }
  textarea {
    width: 100%; min-height: 220px; resize: vertical; padding: 12px;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
    background: var(--bg); color: var(--text);
  }
  textarea:focus, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 14px; }
  .field { display: flex; flex-direction: column; }
  select, input[type=number] {
    padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: var(--bg); color: var(--text);
  }
  input[type=number] { width: 110px; }
  button {
    padding: 10px 18px; border-radius: 8px; border: 1px solid var(--border);
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--card); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .6; cursor: progress; }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  #result { display: none; }
  #summary { background: var(--ok-bg); border-radius: 8px; padding: 14px; font-size: 1.05rem; white-space: pre-wrap; }
  #error { display: none; background: var(--err-bg); color: var(--err-text); border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .result-head h2 { font-size: 1.05rem; margin: 0; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>AI Text Summarizer</h1>
  <p class="sub">Paste text, choose a length, and get a short summary from a pretrained language model.</p>

  <div id="error" role="alert"></div>

  <section class="card">
    <label for="text">Text to summarize</label>
    <textarea id="text" placeholder="Paste an article, report or any long text here…"></textarea>
    <div class="meta"><span id="count">0 words</span> · limit {{ max_words }} words</div>

    <div class="row">
      <div class="field">
        <label for="length">Summary length</label>
        <select id="length">
          <option value="short">Short (~30 words)</option>
          <option value="medium" selected>Medium (~60 words)</option>
          <option value="long">Long (~100 words)</option>
          <option value="custom">Custom…</option>
        </select>
      </div>
      <div class="field" id="customBox" style="display:none">
        <label for="custom">Words</label>
        <input type="number" id="custom" min="15" max="300" value="50">
      </div>
      <div class="field">
        <label for="example">Try an example</label>
        <select id="example"><option value="">Choose…</option></select>
      </div>
      <div class="spacer"></div>
      <button id="clear">Clear</button>
      <button id="go" class="primary">Summarize</button>
    </div>
  </section>

  <section class="card" id="result">
    <div class="result-head">
      <h2>Summary</h2>
      <button id="copy">Copy</button>
    </div>
    <div id="summary"></div>
    <div class="meta" id="stats"></div>
    <div class="note">Always check summaries against the original text. Models can misstate numbers or leave out context.</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const text = $("text"), go = $("go"), errBox = $("error");
let examples = [];

const words = s => (s.trim().match(/\S+/g) || []).length;
text.addEventListener("input", () => { $("count").textContent = words(text.value) + " words"; });

$("length").addEventListener("change", e => {
  $("customBox").style.display = e.target.value === "custom" ? "flex" : "none";
});

fetch("/api/examples").then(r => r.json()).then(list => {
  examples = list;
  list.forEach(e => {
    const o = document.createElement("option");
    o.value = e.id; o.textContent = e.topic;
    $("example").appendChild(o);
  });
}).catch(() => {});

$("example").addEventListener("change", e => {
  const ex = examples.find(x => String(x.id) === e.target.value);
  if (ex) { text.value = ex.text; text.dispatchEvent(new Event("input")); }
});

$("clear").addEventListener("click", () => {
  text.value = ""; text.dispatchEvent(new Event("input"));
  $("result").style.display = "none"; errBox.style.display = "none";
  $("example").value = "";
});

function showError(msg) { errBox.textContent = msg; errBox.style.display = "block"; }

go.addEventListener("click", async () => {
  errBox.style.display = "none";
  if (!text.value.trim()) { showError("Please paste some text to summarize."); return; }
  let length = $("length").value;
  if (length === "custom") length = parseInt($("custom").value, 10);

  go.disabled = true; go.textContent = "Summarizing…";
  try {
    const res = await fetch("/api/summarize", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: text.value, length})
    });
    const data = await res.json();
    if (!res.ok) { showError(data.error || "Something went wrong."); return; }
    $("summary").textContent = data.summary;
    $("stats").textContent = data.input_words + " words → " + data.summary_words + " words";
    $("result").style.display = "block";
  } catch (e) {
    showError("Could not reach the server. Is web.py still running?");
  } finally {
    go.disabled = false; go.textContent = "Summarize";
  }
});

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText($("summary").textContent);
    $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy", 1500);
  } catch (e) { showError("Copy failed. Select the text and copy it manually."); }
});
</script>
</body>
</html>
